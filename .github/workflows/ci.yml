name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1 # colored output by pytest etc.

permissions: {} # Set permissions at the job level.

jobs:

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5

  tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
    - run: |
        python -m pip install --upgrade pip
        python -m pip install hatch

    - name: Install Playwright browsers
      run: hatch run playwright install --with-deps chromium

    - name: Run test suite in parallel with measuring code coverage
      run: hatch test --cover-quiet --parallel
    - name: Upload coverage data to coveralls.io
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
